<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>远程登录预览 · AutoSteamScout</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar"><div><div class="eyebrow">AUTO STEAM SCOUT</div><h1>远程登录预览</h1></div></header>
  <main>
    <section class="panel debug-login">
      <h2>输入访问密码</h2>
      <p>密码在服务器启动远程调试模式时打印。通过后可查看无头浏览器画面并手动完成拼图验证。</p>
      <form action="/debug/login" method="post">
        <label>访问密码<input type="password" name="password" required autocomplete="current-password" autofocus></label>
        <button type="submit">打开登录画面</button>
      </form>
      <p id="login-error" class="debug-error" hidden>密码不正确，请重试。</p>
    </section>
  </main>
  <script>document.getElementById('login-error').hidden = !new URLSearchParams(location.search).has('error');</script>
</body>
</html>
