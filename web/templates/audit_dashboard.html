<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>SENTINEL | 财务资产审计看板</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; }
        .glass-card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; }
        .stat-value { font-family: 'Segoe UI', monospace; }
    </style>
</head>
<body class="p-8">
    <div class="max-w-6xl mx-auto">
        <div class="flex justify-between items-end mb-8 border-b border-gray-700 pb-4">
            <div class="flex items-center gap-4">
                <a href="/" class="text-gray-400 hover:text-blue-400 transition text-sm flex items-center gap-2">
                    ← 返回主页
                </a>
                <div>
                    <h1 class="text-3xl font-bold text-blue-400">📊 母舰资产全息审计</h1>
                    <p class="text-gray-500 text-sm mt-1" id="update_time">正在连接母舰数据库...</p>
                </div>
            </div>
            <div class="flex gap-3">
                <button onclick="autoListMissing()" id="auto_list_btn" class="bg-green-700 hover:bg-green-600 disabled:bg-gray-700 disabled:cursor-not-allowed px-4 py-2 rounded text-sm transition flex items-center gap-2">
                    🚀 一键上架
                </button>
                <button onclick="syncAllAssets()" id="sync_btn" class="bg-blue-700 hover:bg-blue-600 disabled:bg-gray-700 disabled:cursor-not-allowed px-4 py-2 rounded text-sm transition flex items-center gap-2">
                    🔄 一键同步
                </button>
                <button onclick="refreshAuditData()" class="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded text-sm transition">🔄 刷新数据</button>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="glass-card p-6 border-l-4 border-l-red-500">
                <div class="text-gray-500 text-xs uppercase mb-1">采购总成本</div>
                <div id="total_investment" class="text-3xl font-bold stat-value">¥ 0.00</div>
            </div>
            <div class="glass-card p-6 border-l-4 border-l-green-500">
                <div class="text-gray-500 text-xs uppercase mb-1 font-bold">💰 当前已实现利润</div>
                <div id="current_profit" class="text-3xl font-bold stat-value">¥ 0.00</div>
            </div>
            <div class="glass-card p-6 border-l-4 border-l-cyan-500">
                <div class="text-gray-500 text-xs uppercase mb-1 font-bold">📈 最终预期总利润</div>
                <div id="expected_profit" class="text-3xl font-bold stat-value">¥ 0.00</div>
            </div>

            <div class="glass-card p-6 border-l-4 border-l-blue-500">
                <div class="text-gray-500 text-xs uppercase mb-1">已回收现金 (到手)</div>
                <div id="realized_cash" class="text-3xl font-bold text-blue-400 stat-value">¥ 0.00</div>
            </div>
            <div class="glass-card p-6 border-l-4 border-l-purple-500">
                <div class="text-gray-500 text-xs uppercase mb-1 font-bold">🚀 投资回报率 (ROI)</div>
                <div class="flex flex-col gap-1">
                    <div id="sold_roi" class="text-3xl font-bold text-purple-400 stat-value">0.00%</div>
                    <div class="text-xs text-gray-500">预期全盘：<span id="exp_roi" class="text-gray-400">0%</span></div>
                </div>
            </div>
            <div class="glass-card p-6 border-l-4 border-l-yellow-500">
                <div class="text-gray-500 text-xs uppercase mb-1">货架总净值</div>
                <div id="floating_asset" class="text-3xl font-bold text-yellow-500 stat-value">¥ 0.00</div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2 glass-card p-6">
                <h3 class="text-lg font-bold mb-4 text-gray-300">🕒 货架账龄分析</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="text-gray-500 border-b border-gray-800">
                            <tr>
                                <th class="pb-3">游戏实体</th>
                                <th class="pb-3">挂单价</th>
                                <th class="pb-3 text-right">已挂时长</th>
                            </tr>
                        </thead>
                        <tbody id="aging_body"></tbody>
                    </table>
                </div>
            </div>

            <div class="glass-card p-6">
                <h3 class="text-lg font-bold mb-4 text-yellow-400 flex items-center justify-between">
                    <span>🟡 待售商品 (未上架)</span>
                    <span id="missing_count" class="text-xs bg-yellow-900/50 px-2 py-1 rounded">0 个</span>
                </h3>
                <div id="missing_body" class="space-y-3"></div>
            </div>
        </div>

        <!-- 🚀 新增：全息资产溯源清单 -->
        <div class="glass-card p-6 mt-8">
            <h3 class="text-lg font-bold mb-4 text-purple-400">📋 全息资产溯源清单 (全量交易明细)</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead class="text-gray-500 border-b border-gray-800">
                        <tr>
                            <th class="pb-3">状态</th>
                            <th class="pb-3">采购名称</th>
                            <th class="pb-3">映射销售名</th>
                            <th class="pb-3 text-right">采购成本</th>
                            <th class="pb-3 text-right">预估收入</th>
                            <th class="pb-3 text-right">盈亏</th>
                        </tr>
                    </thead>
                    <tbody id="trace_body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
       // 📡 网页雷达：记录上一次母舰审计的时间戳
    let lastUpdateAt = "";
    
    // 🔐 API Token（如果需要认证）- 永久保存在 localStorage
    // 用法：第一次访问时输入，之后会自动记住
    const API_TOKEN = localStorage.getItem('sentinel_token') || null;

    async function loadAudit() {
        try {
            const headers = API_TOKEN ? { 'Authorization': `Bearer ${API_TOKEN}` } : {};
            const res = await fetch('/api/audit_stats', { headers });
            
            // 🔐 401 未授权处理 - 只显示一次提示
            if (res.status === 401) {
                // 如果已经有 Token 但失效了，清除它
                if (API_TOKEN) {
                    localStorage.removeItem('sentinel_token');
                }
                
                const token = prompt(
                    '🔒 需要访问密码\n\n' +
                    '请输入 API Token'
                );
                
                if (token) {
                    localStorage.setItem('sentinel_token', token);
                    location.reload();
                }
                return;
            }
            
            if (!res.ok) throw new Error("网络响应异常");
            const d = await res.json();

            // 💡 核心保护：如果后端返回的时间戳没变，直接切断后续逻辑，网页动都不动一下
            if (lastUpdateAt === d.update_at) {
                console.log("🧊 账本未变动，保持静默...");
                return;
            }

            // 💡 只有时间戳变了（说明后台算完新账了），才开始"贴纸"更新
            console.log(`🚀 侦测到新账本 [${d.update_at}]，正在更新视图...`);
            lastUpdateAt = d.update_at;

            // 📊 初始化 lastTraceDetails（用于增量计算）
            lastTraceDetails = d.details.trace_details || [];

            // --- 以下是静默替换逻辑，不会引起白屏或归零 ---
            document.getElementById('update_time').innerText = "最后清算：" + d.update_at;
            document.getElementById('total_investment').innerText = "¥ " + d.summary.total_investment;
            document.getElementById('realized_cash').innerText = "¥ " + d.summary.realized_cash;
            document.getElementById('floating_asset').innerText = "¥ " + d.summary.floating_asset;

            // 🚀 ROI 数据接驳（带 Null 守护）
            const rawSoldRoi = d.summary.sold_roi ?? 0;
            const rawExpRoi = d.summary.total_expected_roi ?? 0;
            document.getElementById('sold_roi').innerText = rawSoldRoi + "%";
            document.getElementById('exp_roi').innerText = rawExpRoi + "%";

            document.getElementById('current_profit').innerText = "¥ " + d.summary.current_profit;
            document.getElementById('expected_profit').innerText = "¥ " + d.summary.expected_profit;

            // 顺便做个颜色高亮逻辑：如果利润是负的（还没回本），显示红色，正的显示绿色
            const cp = parseFloat(d.summary.current_profit) || 0;
            document.getElementById('current_profit').className = `text-3xl font-bold stat-value ${cp >= 0 ? 'text-green-400' : 'text-red-400'}`;

            // 🚀 ROI 颜色：>20% 绿色优秀，5-20% 紫色正常，<5% 红色警示
            const roiVal = parseFloat(rawSoldRoi) || 0;
            let roiColor = "text-purple-400";
            if (roiVal > 20) roiColor = "text-green-400";
            else if (roiVal < 5) roiColor = "text-red-400";
            document.getElementById('sold_roi').className = `text-3xl font-bold stat-value ${roiColor}`;
            // 渲染表格 (只替换 tbody 内部，不闪烁)
            const agingBody = document.getElementById('aging_body');
            agingBody.innerHTML = d.details.on_shelf_aging.map(item => `
                <tr class="border-b border-gray-800 hover:bg-gray-800/50 transition-all duration-300">
                    <td class="py-4 font-medium text-gray-300">${item.name}</td>
                    <td class="py-4 text-blue-400 font-mono">¥${item.price}</td>
                    <td class="py-4 text-right font-bold ${item.days > 7 ? 'text-red-500' : (item.days > 3 ? 'text-yellow-500' : 'text-green-500')}">${item.days} 天</td>
                </tr>`).join('');

            // 🚀 渲染待售商品（带上架按钮）
            const missingBody = document.getElementById('missing_body');
            const missingList = d.details.missing_from_steampy || [];

            // 更新待售商品计数
            document.getElementById('missing_count').innerText = `${missingList.length} 个`;

            if (missingList.length === 0) {
                missingBody.innerHTML = '<div class="text-green-500 text-sm italic">✨ 仓库已清空，全部商品已在售</div>';
            } else {
                // 从 trace_details 中找到对应的完整信息
                const traceDetails = d.details.trace_details || [];
                missingBody.innerHTML = missingList.map(name => {
                    // 在 trace_details 中查找对应的商品
                    const item = traceDetails.find(t => t.source_name === name && t.tag === '遗珠');
                    const uid = item ? item.uid : '';
                    const cost = item ? item.cost : 0;

                    return `
                    <div class="p-3 bg-yellow-900/10 border border-yellow-900/20 rounded text-sm text-yellow-200 flex items-center justify-between gap-3">
                        <div class="flex-1 min-w-0">
                            <div class="font-medium truncate" title="${name}">🟡 ${name}</div>
                            <div class="text-xs text-gray-500 mt-1">💰 成本：¥${cost?.toFixed(2) || '0.00'}</div>
                            <div class="text-xs text-gray-600 mt-0.5 font-mono">ID: ${uid}</div>
                        </div>
                        <div class="flex items-center gap-2 flex-shrink-0">
                            <button onclick="listSingleItem('${encodeURIComponent(uid)}', '${encodeURIComponent(name)}', ${cost || 0})"
                                    class="px-3 py-1.5 bg-green-700 hover:bg-green-600 disabled:bg-gray-700 disabled:cursor-not-allowed rounded text-xs transition flex items-center gap-1"
                                    title="查询 SteamPy 价格并上架此商品">
                                🚀 上架此项
                            </button>
                            <button onclick="markAsDamaged('${encodeURIComponent(uid)}', '${encodeURIComponent(name)}')"
                                    class="px-3 py-1.5 bg-red-900/50 hover:bg-red-800 rounded text-xs transition"
                                    title="标记为损毁，只记成本">
                                🚫 标记损毁
                            </button>
                        </div>
                    </div>
                    `;
                }).join('');
            }

            // 🚀 渲染全息资产溯源清单（交易明细）
            const traceBody = document.getElementById('trace_body');
            const traceDetails = d.details.trace_details || [];
            
            // 🚀 稳定排序：主键为状态，次键为采购成本（降序），再次键为名称（字典序）
            const sortedDetails = [...traceDetails].sort((a, b) => {
                const order = { "已售": 0, "在售": 1, "待售": 2, "来源不明": 3 };
                const statusDiff = (order[a.tag] ?? 99) - (order[b.tag] ?? 99);
                if (statusDiff !== 0) return statusDiff;
                // 状态相同时，按成本降序排列
                const costDiff = b.cost - a.cost;
                if (Math.abs(costDiff) > 0.01) return costDiff;
                // 成本也相同时，按名称字典序排列（确保稳定性）
                return a.source_name.localeCompare(b.source_name, 'zh-Hans-CN');
            });

            traceBody.innerHTML = sortedDetails.map(item => {
                // 状态标签样式
                const tagStyles = {
                    "已售": "bg-green-900/30 text-green-400 border-green-800",
                    "在售": "bg-blue-900/30 text-blue-400 border-blue-800",
                    "待售": "bg-yellow-900/30 text-yellow-400 border-yellow-800",
                    "来源不明": "bg-purple-900/30 text-purple-400 border-purple-800"
                };
                const tagStyle = tagStyles[item.tag] || "bg-gray-800 text-gray-400";

                // 🚀 盈亏样式：profit 永远是数字
                const profitVal = parseFloat(item.profit);
                let profitClass = "text-gray-400";
                let profitDisplay = `¥${profitVal.toFixed(2)}`;

                if (profitVal > 0) profitClass = "text-green-400 font-bold";
                else if (profitVal < 0) profitClass = "text-red-400 font-bold";

                // 🚀 状态显示：把"遗珠"改成"待售"
                const displayTag = item.tag === '遗珠' ? '待售' : item.tag;

                return `
                <tr class="border-b border-gray-800 hover:bg-gray-800/50 transition-all duration-200">
                    <td class="py-3">
                        <span class="px-2 py-1 rounded text-xs border ${tagStyle}">${displayTag}</span>
                    </td>
                    <td class="py-3 font-medium text-gray-300">${item.source_name}</td>
                    <td class="py-3 text-gray-500 text-sm">${item.mapped_name !== item.source_name ? item.mapped_name : '-'}</td>
                    <td class="py-3 text-right text-red-400 font-mono">¥${item.cost.toFixed(2)}</td>
                    <td class="py-3 text-right text-blue-400 font-mono">¥${item.est_revenue.toFixed(2)}</td>
                    <td class="py-3 text-right font-mono ${profitClass}">${profitDisplay}</td>
                </tr>`;
            }).join('') || '<tr><td colspan="6" class="py-8 text-center text-gray-500">📊 暂无交易记录</td></tr>';

        } catch (e) {
            console.warn("📡 信号干扰中，正在维持当前全息投影...");
        }
    }

    // 🚀 一键上架功能
    let autoListInProgress = false;

    // 🚀 单个商品上架函数
    async function listSingleItem(uid, name, cost) {
        if (autoListInProgress) {
            alert("⏳ 上架任务正在进行中，请稍候...");
            return;
        }

        const confirmMsg = `🚀 准备上架：${name}\n\n系统将：\n1. 查询 SteamPy 市场价格\n2. 以略低于市场的价格自动上架\n3. 发送飞书通知\n\n💰 采购成本：¥${cost}\n🆔 商品 ID: ${uid}\n\n⚠️ 注意：利润不足或会亏本的商品将自动跳过\n\n确认继续？`;
        if (!confirm(confirmMsg)) {
            return;
        }

        // 禁用所有上架按钮
        const allButtons = document.querySelectorAll('button[onclick^="listSingleItem"]');
        allButtons.forEach(btn => {
            btn.disabled = true;
            btn.innerHTML = "⏳ 上架中...";
        });

        autoListInProgress = true;

        try {
            const headers = API_TOKEN ? { 'Authorization': `Bearer ${API_TOKEN}` } : {};

            const res = await fetch('/api/list_single_item', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    ...headers
                },
                body: JSON.stringify({
                    uid: decodeURIComponent(uid),
                    name: decodeURIComponent(name),
                    cost: parseFloat(cost)
                    // 🚨 CDKey 由后端从采购账本中查找，不经过前端
                })
            });

            const result = await res.json();

            if (result.success) {
                if (result.status === "success") {
                    // 上架成功，显示消息并刷新页面
                    const statusMsg = `✅ 上架成功！\n\n📊 上架信息：\n├─ 价格：¥${result.listing_price}\n├─ 预期利润：¥${result.profit}\n└─ 匹配名：${result.market_name}\n\n⏳ 数据已自动同步，点击确定后刷新页面...`;
                    alert(statusMsg);
                    // 用户点击确定后立即刷新
                    location.reload();
                    return;
                } else if (result.status.includes("skipped")) {
                    // 被跳过
                    alert(`⏭️ 已跳过\n\n📝 原因：${result.message}`);
                    location.reload();
                    return;
                } else {
                    // 其他状态
                    alert(`ℹ️ 处理完成\n\n📝 状态：${result.status}\n📝 详情：${result.message}`);
                    location.reload();
                    return;
                }
            } else {
                // 上架失败
                alert(`❌ 上架失败：${result.message}`);
            }
        } catch (e) {
            console.error("上架异常:", e);
            alert(`❌ 请求失败：${e.message}`);
        } finally {
            // 只有出错时才恢复按钮（成功/跳过都会刷新页面）
            const allButtons = document.querySelectorAll('button[onclick^="listSingleItem"]');
            allButtons.forEach(btn => {
                btn.disabled = false;
                btn.innerHTML = "🚀 上架此项";
            });
        }
    }

    // 🔄 一键同步全平台资产
    async function syncAllAssets() {
        const confirmMsg = `🔄 确认同步全平台资产？\n\n系统将：\n1. 同步杉果订单数据\n2. 同步 SteamPy 库存数据\n3. 刷新财务数据\n\n⏳ 预计耗时：30-60 秒\n\n确认继续？`;
        if (!confirm(confirmMsg)) {
            return;
        }

        const syncBtn = document.getElementById('sync_btn');
        const originalText = syncBtn.innerHTML;
        
        try {
            syncBtn.disabled = true;
            syncBtn.innerHTML = "⏳ 同步中...";
            
            const headers = API_TOKEN ? { 'Authorization': `Bearer ${API_TOKEN}` } : {};
            
            const res = await fetch('/api/sync_all', {
                method: 'POST',
                headers: headers
            });
            
            const result = await res.json();
            
            if (result.status === "success") {
                alert(`✅ 同步完成！\n\n${result.msg || ''}`);
                // 同步后刷新页面
                setTimeout(() => location.reload(), 1000);
            } else {
                alert(`❌ 同步失败：${result.msg || '未知错误'}`);
            }
        } catch (e) {
            console.error("同步异常:", e);
            alert(`❌ 同步失败：${e.message}`);
        } finally {
            syncBtn.disabled = false;
            syncBtn.innerHTML = originalText;
        }
    }

    // 🚫 标记损毁函数
    async function markAsDamaged(uid, name) {
        const confirmMsg = `🚫 确认标记为损毁？\n\n游戏：${name}\n🆔 商品 ID: ${uid}\n\n标记为损毁后：\n├─ 只记录成本\n├─ 不允许上架\n└─ 在财务报表中单独显示\n\n确认继续？`;
        if (!confirm(confirmMsg)) {
            return;
        }

        try {
            const headers = API_TOKEN ? { 'Authorization': `Bearer ${API_TOKEN}` } : {};

            const res = await fetch('/api/mark_damaged', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    ...headers
                },
                body: JSON.stringify({
                    uid: decodeURIComponent(uid),
                    name: decodeURIComponent(name)
                    // 🚨 CDKey 由后端从采购账本中查找，不经过前端
                })
            });

            const result = await res.json();

            if (result.success) {
                alert(`✅ 已标记为损毁\n\n${result.message}`);
                setTimeout(() => location.reload(), 1000);
            } else {
                alert(`❌ 标记失败：${result.message}`);
            }
        } catch (e) {
            console.error("标记损毁异常:", e);
            alert(`❌ 请求失败：${e.message}`);
        }
    }

    async function autoListMissing() {
        if (autoListInProgress) {
            alert("⏳ 上架任务正在进行中，请稍候...");
            return;
        }

        const missingCount = parseInt(document.getElementById('missing_count').innerText) || 0;
        if (missingCount === 0) {
            alert("✨ 没有待上架商品");
            return;
        }

        const confirmMsg = `🚀 准备上架 ${missingCount} 个待售商品\n\n系统将：\n1. 查询 SteamPy 市场价格\n2. 以略低于市场的价格自动上架\n3. 发送飞书通知\n\n⚠️ 注意：利润不足或会亏本的商品将自动跳过\n\n确认继续？`;
        if (!confirm(confirmMsg)) {
            return;
        }

        const btn = document.getElementById('auto_list_btn');
        const originalText = btn.innerHTML;

        try {
            autoListInProgress = true;
            btn.disabled = true;
            btn.innerHTML = "⏳ 上架中...";
            btn.classList.add('opacity-50');

            const headers = API_TOKEN ? { 'Authorization': `Bearer ${API_TOKEN}` } : {};

            const res = await fetch('/api/auto_list', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    ...headers
                },
                body: JSON.stringify({})
            });

            const result = await res.json();

            if (result.success) {
                const summary = `
✅ 上架完成！

📊 汇总报告：
├─ 总处理：${result.total || 0} 个
├─ 成功上架：${result.success_count || 0} 个
├─ 上架失败：${result.failed_count || 0} 个
└─ 自动跳过：${result.skipped_count || 0} 个

💡 请查看飞书通知获取详细信息
                `.trim();
                alert(summary);

                // 自动刷新页面
                setTimeout(() => location.reload(), 1000);
            } else {
                alert(`❌ 上架失败：${result.message || '未知错误'}`);
            }
        } catch (e) {
            console.error("自动上架异常:", e);
            alert(`❌ 请求失败：${e.message}`);
        } finally {
            autoListInProgress = false;
            btn.disabled = false;
            btn.innerHTML = originalText;
            btn.classList.remove('opacity-50');
        }
    }

    // 📊 上次的 trace_details（用于计算增量）
    let lastTraceDetails = [];

    // 🚀 计算增量信息
    function calculateDelta(d) {
        const currentDetails = d.details.trace_details || [];
        const delta = {
            new_purchases: [],  // 新增采购
            new_listings: [],   // 新增上架
            new_sales: []       // 新卖出
        };

        // 如果是第一次刷新，不计算增量
        if (lastTraceDetails.length === 0) {
            lastTraceDetails = currentDetails;
            return delta;
        }

        // 创建上次的索引
        const lastIndex = new Map();
        lastTraceDetails.forEach(item => {
            lastIndex.set(item.uid, item);
        });

        // 遍历当前数据，找出新增项
        currentDetails.forEach(item => {
            if (!lastIndex.has(item.uid)) {
                // 新增的项目
                if (item.tag === "遗珠" || item.tag === "待售") {
                    delta.new_purchases.push({
                        name: item.source_name,
                        cost: item.cost
                    });
                } else if (item.tag === "在售") {
                    delta.new_listings.push({
                        name: item.source_name,
                        price: item.est_revenue
                    });
                } else if (item.tag === "已售") {
                    delta.new_sales.push({
                        name: item.source_name,
                        price: item.est_revenue
                    });
                }
            }
        });

        // 更新上次的 trace_details
        lastTraceDetails = currentDetails;

        return delta;
    }

    // 🚀 刷新数据函数（手动/自动共用）
    async function refreshAuditData(showLoading = true) {
        try {
            const headers = API_TOKEN ? { 'Authorization': `Bearer ${API_TOKEN}` } : {};

            // 显示加载状态（仅手动刷新时显示）
            if (showLoading) {
                const refreshBtn = document.querySelector('button[onclick="refreshAuditData()"]');
                if (refreshBtn) {
                    const originalText = refreshBtn.innerHTML;
                    refreshBtn.disabled = true;
                    refreshBtn.innerHTML = "⏳ 同步并刷新中...";

                    setTimeout(() => {
                        refreshBtn.disabled = false;
                        refreshBtn.innerHTML = "🔄 刷新数据";
                    }, 5000);
                }
            }

            // 🔄 先同步资产（调用后端 API）
            console.log("🔄 正在同步全平台资产...");
            try {
                const syncRes = await fetch('/api/sync_all', {
                    method: 'POST',
                    headers: headers
                });
                const syncResult = await syncRes.json();
                if (syncResult.status === "success") {
                    console.log("✅ 资产同步完成");
                } else {
                    console.warn("⚠️ 资产同步失败:", syncResult.msg);
                }
            } catch (e) {
                console.warn("⚠️ 资产同步异常:", e);
            }

            // 📊 再读取审计数据
            const res = await fetch('/api/audit_stats', { headers });

            if (res.status === 401) {
                // Token 失效，刷新页面重新认证
                location.reload();
                return;
            }

            if (!res.ok) throw new Error("网络响应异常");
            const d = await res.json();

            // 🛡️ 检测数据是否更新
            if (d.update_at === lastUpdateAt) {
                console.log("✅ 数据未更新，跳过刷新");
                if (showLoading) {
                    alert("✅ 数据已是最新，无需刷新");
                }
                return;
            }

            console.log(`🚀 检测到新数据 [${d.update_at}]，正在刷新页面...`);
            lastUpdateAt = d.update_at;

            // 🚀 发送飞书通知（包含增量信息）
            try {
                // 计算增量信息
                const增量信息 = calculateDelta(d);

                await fetch('/api/notify_refresh', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        ...headers
                    },
                    body: JSON.stringify({
                        update_at: d.update_at,
                        total_investment: d.summary.total_investment,
                        current_profit: d.summary.current_profit,
                        expected_profit: d.summary.expected_profit,
                        realized_cash: d.summary.realized_cash,
                        details: 增量信息
                    })
                });
                console.log("📡 飞书通知已发送");
            } catch (e) {
                console.warn("📡 飞书通知发送失败:", e);
            }

            // 🔄 刷新页面（让用户看到最新数据）
            setTimeout(() => location.reload(), 1000);

        } catch (e) {
            console.warn("📡 刷新失败:", e);
            if (showLoading) {
                alert("❌ 刷新失败：" + e.message);
            }
        }
    }

    // 🚀 初始化母舰控制台
    let isFirstLoad = true; // 🆕 标记是否首次加载

    window.onload = () => {
        // 进页面先加载一次数据（首次加载：不同步、不发通知）
        loadAudit();
        isFirstLoad = false; // 标记首次加载完成

        // ⏰ 定时刷新：每 6 小时自动同步并刷新
        // 6 小时 = 6 * 60 * 60 * 1000 = 21600000ms
        setInterval(() => refreshAuditData(true), 21600000);

        console.log("📊 审计看板已启动，每 6 小时自动同步并刷新");
    };
    </script>
