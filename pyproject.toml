[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autoscout"
version = "0.4.10"
description = "Read-only game-key arbitrage discovery and cash settlement ledger"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn>=0.29,<1",
  "playwright>=1.40,<2",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.23,<2", "httpx>=0.27,<1"]

[project.scripts]
autoscout = "autoscout.__main__:main"

[tool.setuptools.packages.find]
include = ["autoscout*"]

[tool.setuptools.package-data]
autoscout = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
